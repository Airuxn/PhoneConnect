name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scripts:
    name: Shell, Node, and Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mcp-bridge/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Shell syntax and ShellCheck
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh

      - name: Node syntax and bridge dependencies
        run: |
          node --check scripts/gsm-api.mjs
          node --check mcp-bridge/bridge.mjs
          npm ci --prefix mcp-bridge
          npm audit --prefix mcp-bridge --audit-level=critical

      - name: Bridge requires API key
        run: |
          set +e
          POCKET_MCP_URL=http://127.0.0.1:18090/mcp node mcp-bridge/bridge.mjs </dev/null >/dev/null 2>&1
          code=$?
          set -e
          test "$code" -ne 0

      - name: Python proxy script
        run: python3 -m py_compile scripts/phone-http-proxy.py

      - name: Validate example configs
        run: |
          python3 -c "import json; json.load(open('config/mcp-android-phone.json.example'))"
          python3 -c "
          from pathlib import Path
          env = Path('config/secrets.env.example').read_text(encoding='utf-8')
          for line in env.splitlines():
              s = line.strip()
              if s and not s.startswith('#'):
                  assert '=' in line, line
          "
