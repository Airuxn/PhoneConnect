version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Brussels
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: npm
    directory: /mcp-bridge
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Brussels
    open-pull-requests-limit: 1
    groups:
      mcp-bridge:
        patterns: ["*"]
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - npm

  - package-ecosystem: npm
    directory: /scripts
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Brussels
    open-pull-requests-limit: 1
    groups:
      scripts:
        patterns: ["*"]
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - npm
